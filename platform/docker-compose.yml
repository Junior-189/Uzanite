# UZANITE platform — local / single-host deployment.
#
# Hardened in M13. Three things were wrong before:
#
#  1. `DATABASE_URL` was pinned here to the table OWNER role, overriding any
#     `.env` that correctly pointed at `uzanite_app`. Compose `environment:`
#     wins over `env_file:`, so FORCE ROW LEVEL SECURITY was silently
#     unenforceable in every dev and staging environment — exactly where
#     isolation bugs get written.
#  2. Postgres and Redis published to the host with the password `uzanite` and
#     no Redis auth, so on any host with a public interface they were directly
#     reachable.
#  3. The worker received no database URL and did not wait for Postgres.
#
# Ports are now bound to loopback only, credentials come from the environment,
# and the API connects as the non-owner role so RLS applies.

x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-uzanite}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-uzanite}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment: *postgres-env
    # Loopback only. Use an SSH tunnel for remote access rather than exposing
    # the database to the network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the non-owner `uzanite_app` role on first boot so RLS applies.
      - ./apps/api/prisma/sql/ci-roles.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uzanite}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - postgres
      # Guard rails at the server level as well as per-role (see PrismaService).
      - -c
      - statement_timeout=15000
      - -c
      - lock_timeout=5000
      - -c
      - idle_in_transaction_session_timeout=15000

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF for durability of queued jobs; requirepass so it is not open.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

  # One-shot migration job. Runs as the OWNER role (migrations need DDL), then
  # exits. The API never holds owner privileges.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      # Dedicated stage: retains the Prisma CLI that the runtime image prunes.
      target: migrate
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-uzanite}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-uzanite}?schema=public
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db execute --file prisma/sql/ci-roles.sql --schema prisma/schema.prisma"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      # Non-owner role: this is what makes FORCE RLS effective.
      DATABASE_URL: postgresql://uzanite_app:${APP_DB_PASSWORD:-uzanite_app}@postgres:5432/${POSTGRES_DB:-uzanite}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RLS_ENABLED: "true"
      TRUST_PROXY_HOPS: "1"
    ports:
      - "127.0.0.1:4000:4000"
    # Persist signed private uploads (product images, payment proofs). The
    # default STORAGE_LOCAL_DIR resolves against the app cwd (/app/apps/api).
    # For multi-host or autoscaled API replicas, use shared object storage
    # instead — a per-host volume is not shared across machines.
    volumes:
      - uploads:/app/apps/api/private_uploads_platform
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env
    environment:
      # The worker needs the database too; omitting it was a latent bug.
      DATABASE_URL: postgresql://uzanite_app:${APP_DB_PASSWORD:-uzanite_app}@postgres:5432/${POSTGRES_DB:-uzanite}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RLS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
  redisdata:
  uploads:
