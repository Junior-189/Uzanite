# =============================================================================
# UZANITE gateway — Strangler routing + load balancing.
#
# Two jobs:
#   1. Route migrated domains to NestJS and everything else to the Express app.
#   2. Balance across API replicas and terminate abuse at the edge.
#
# Hardened in M13:
#   - `X-Forwarded-For` was already set, but the NestJS app did not trust it, so
#     every request looked like it came from this proxy and the per-IP rate
#     limiter collapsed into one global bucket. The app now sets
#     `trust proxy` (TRUST_PROXY_HOPS); keep these headers in sync with it.
#   - Real upstream blocks with health checks and keepalive, so adding replicas
#     works. The API is stateless (JWT auth, shared Redis) so NO session
#     affinity is required — do not add ip_hash, it would only concentrate load.
#   - Edge rate limiting as a first line of defence, sized ABOVE the
#     application limits so the app stays authoritative and the edge only
#     absorbs volumetric floods.
#   - gzip, which was missing entirely. On the 2G/3G connections this product
#     targets it is the cheapest latency win available.
# =============================================================================

# ── Rate limiting zones (edge). Deliberately looser than the in-app limits.
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

# ── Upstreams.
# `least_conn` suits mixed-cost requests better than round-robin: a replica
# stuck on a slow report does not keep receiving new work.
upstream nest_api {
  least_conn;
  server api-1:4000 max_fails=3 fail_timeout=15s;
  # Add replicas here; no affinity needed.
  # server api-2:4000 max_fails=3 fail_timeout=15s;
  keepalive 32;
}

upstream express_api {
  least_conn;
  server legacy-1:3000 max_fails=3 fail_timeout=15s;
  keepalive 32;
}

# ── Compression.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types
  application/json
  application/javascript
  application/manifest+json
  text/css
  text/plain
  text/javascript
  image/svg+xml;

server {
  listen 80;
  server_name _;

  # Do not advertise the version.
  server_tokens off;

  # Bodies: generous enough for a 5MB image upload, bounded against abuse.
  client_max_body_size 8m;
  client_body_timeout 30s;
  client_header_timeout 15s;

  limit_conn perip 40;

  # Shared proxy headers. `X-Forwarded-For` is what the app's rate limiter and
  # lockout keys ultimately derive from, so it must be accurate.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;

  # Timeouts. Read timeout exceeds the app's provider timeout (8s default) so a
  # slow third party surfaces as the application's own error, not a gateway 504.
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  # Retry the next replica only on connection-level failures — never on a
  # request that may already have been processed, which could duplicate an
  # order or a payment.
  proxy_next_upstream error timeout http_502 http_503 http_504;
  proxy_next_upstream_tries 2;

  # ── Auth: tight edge limit on credential endpoints.
  location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password|accept-invite) {
    limit_req zone=auth burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://nest_api;
  }

  # ── Webhooks: higher ceiling (providers batch), and no retry — a replayed
  # webhook is handled by application idempotency, but there is no reason to
  # double-deliver from the edge.
  location ~ ^/api/v1/(payments|whatsapp)/webhook {
    limit_req zone=webhook burst=100 nodelay;
    limit_req_status 429;
    proxy_next_upstream off;
    proxy_pass http://nest_api;
  }

  # ── Migrated domains (NestJS).
  location ~ ^/api/v1/ {
    limit_req zone=general burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://nest_api;
  }

  # ── Probes. Not rate limited, not logged: the load balancer calls them
  # constantly and a 429 here would take healthy replicas out of rotation.
  location = /api/v1/health {
    access_log off;
    proxy_pass http://nest_api;
  }
  location = /api/v1/ready {
    access_log off;
    proxy_pass http://nest_api;
  }

  # ── Metrics: token-protected in the app, but keep it off the public edge.
  location = /api/v1/metrics {
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;
    proxy_pass http://nest_api;
  }

  # ── Static assets: content-hashed by Vite, so cache them hard. This is what
  # makes the vendor-chunk split pay off on repeat visits.
  location ~* ^/admin/assets/.*\.(js|css|woff2?|png|svg|jpg|webp)$ {
    proxy_pass http://express_api;
    proxy_cache_valid 200 30d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # ── Everything else (Express: unmigrated REST, /webhook, /uploads, /admin).
  location / {
    limit_req zone=general burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://express_api;
  }
}
