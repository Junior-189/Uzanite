name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Run tests
        run: npm test
        env:
          JWT_SECRET: ci-test-secret-key-0123456789abcdef0123456789abcdef
          DISABLE_TRANSACTIONS: 'true'

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      # The client had no tests at all before M13, for a UI that handles money
      # and stock. These cover credential storage and the network layer.
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
